<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stadium Explained – Cric Gyan</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--c:#4df3ff;--m:#ff5fd2;--g:#9dff6a;--bg:#020a12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;color:#d8fbff;font:500 18px/1.35 Rajdhani,'Arial Narrow',sans-serif;background:var(--bg)}
body{background:radial-gradient(ellipse at 50% 0,#08334a 0,#020a12 62%) fixed var(--bg);min-height:100%}
nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 10px 8px;max-width:1100px;margin:auto;width:100%}
.nav-brand{font:700 18px/1.2 Orbitron,sans-serif;color:var(--c);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 12px rgba(77,243,255,.45);text-align:center}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
nav a{color:var(--c);border:1px solid #1d6f80;border-radius:20px;padding:4px 14px;text-decoration:none;font:600 16px/1.2 Rajdhani,sans-serif;white-space:nowrap;transition:all .15s ease}
nav a:hover{background:rgba(77,243,255,.12);border-color:var(--c);box-shadow:0 0 10px rgba(77,243,255,.25)}
nav a.on{background:var(--c);color:#02202a;border-color:var(--c);box-shadow:0 0 12px rgba(77,243,255,.4)}
@media(max-width:420px){
  nav{padding:10px 6px 6px;gap:6px}
  .nav-brand{font-size:16px}
  .nav-links{gap:5px}
  nav a{padding:3px 10px;font-size:15px}
}
h1{font:700 clamp(26px,5vw,40px) Orbitron,sans-serif;margin:6px 12px 2px;max-width:1100px;margin-inline:auto;padding-inline:12px;color:#fff;text-shadow:0 0 18px var(--c)}
.sub{margin:0 auto 10px;max-width:1100px;padding:0 12px;opacity:.8}
main{display:grid;gap:14px;max-width:1100px;margin:auto;padding:0 12px 28px}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.stage{position:relative;border:1px solid #1d6f80;border-radius:16px;overflow:hidden;background:rgba(2,20,32,.65);box-shadow:inset 0 0 50px rgba(77,243,255,.12),0 0 24px rgba(77,243,255,.12)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(77,243,255,.05) 0 1px,transparent 1px 3px)}
canvas{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}
.bar{display:flex;gap:8px;padding:8px;flex-wrap:wrap;border-top:1px solid #12485a;position:relative;z-index:2}
button{font:600 16px Rajdhani,sans-serif;color:var(--c);background:transparent;border:1px solid #1d6f80;border-radius:10px;padding:5px 12px;cursor:pointer}
button:hover,button[aria-pressed=true]{background:rgba(77,243,255,.16);border-color:var(--c);box-shadow:0 0 12px rgba(77,243,255,.35)}
button:focus-visible,nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{font-size:17px}
#info{border:1px solid #1d6f80;border-radius:16px;padding:14px 16px;background:rgba(2,20,32,.6)}
#info h2{font:700 24px Orbitron,sans-serif;margin:6px 0;color:#fff;text-shadow:0 0 12px var(--c)}
.tag{display:inline-block;font-size:15px;border:1px solid var(--m);color:var(--m);border-radius:20px;padding:0 10px}
#info ul{padding-left:20px;margin:8px 0 0}#info li{margin:3px 0}
.hint{font-size:15px;opacity:.6;margin-top:10px}
</style></head><body>
<nav><div class="nav-brand">Cricket Gyan</div><div class="nav-links"><a href="index.html">Playground</a><a href="bowling-guide.html">Bowlers</a><a href="batting-guide.html">Batting</a><a href="stadium-guide.html" class="on" aria-current="page">Stadium</a></div></nav>
<h1>Stadium Explained</h1><p class="sub">Tap any part of the ground or any fielding position. Spin the hologram and learn where everyone stands.</p>
<main><section><div class="stage"><canvas id="c" width="600" height="520" aria-label="Stadium Explained hologram"></canvas>
<div class="bar"><button id="rp">Replay</button><button id="sl" aria-pressed="false">Slow-mo</button><button id="pa" aria-pressed="false">Pause</button><button id="sp" aria-pressed="false" hidden>Auto-rotate</button></div></div></section>
<aside><div class="chips" id="list"></div><article id="info"></article><div class="hint">Drag the field to rotate it. Use the ← → keys to switch.</div></aside></main>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),W=600,H=520;
const lerp=(a,b,u)=>a+(b-a)*u,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let cur=0,pt=0,last=performance.now(),slow=false,paused=false,spin=false;
const glow=(c,b)=>{g.strokeStyle=c;g.fillStyle=c;g.shadowColor=c;g.shadowBlur=b},noglow=()=>{g.shadowBlur=0};
function lab(s,x,y,c='#d8fbff',sz=18,al='center'){g.font='600 '+sz+'px Rajdhani,sans-serif';g.textAlign=al;g.fillStyle=c;g.shadowColor=c;g.shadowBlur=8;g.fillText(s,x,y);g.shadowBlur=0}
function base(now){g.clearRect(0,0,W,H);g.strokeStyle='rgba(77,243,255,.07)';g.lineWidth=1;for(let y=0;y<H;y+=26){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 const sy=(now/12)%H,gr=g.createLinearGradient(0,sy-30,0,sy);gr.addColorStop(0,'rgba(77,243,255,0)');gr.addColorStop(1,'rgba(77,243,255,.12)');g.fillStyle=gr;g.fillRect(0,sy-30,W,30)}
function ball(x,y,r,a){glow('#ff3d6e',14);g.beginPath();g.arc(x,y,r,0,7);g.fill();noglow();g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r*.62,a-.9,a+.9);g.stroke()}
function path(pts,close){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(close)g.closePath()}

const F={cx:300,cy:262,R:236,K:.62,yaw:0},S=F.R/70,BAT=[0,-11];
function T(x,y){const c=Math.cos(F.yaw),n=Math.sin(F.yaw),X=x*c-y*n,Y=x*n+y*c;return[F.cx+X*S,F.cy-Y*S*F.K]}
function ring(r,x=0,y=0){const p=[];for(let i=0;i<=72;i++){const a=i/72*6.2832;p.push(T(x+r*Math.cos(a),y+r*Math.sin(a)))}return p}
const dirv=a=>[Math.sin(a*Math.PI/180),Math.cos(a*Math.PI/180)];
function rope(a){const u=dirv(a),b=BAT[0]*u[0]+BAT[1]*u[1];return -b+Math.sqrt(b*b-(BAT[0]**2+BAT[1]**2-4900))}
const at=(a,d)=>{const u=dirv(a);return[BAT[0]+u[0]*d,BAT[1]+u[1]*d]};
function field(now){
 let b=g.createRadialGradient(F.cx,F.cy+24,10,F.cx,F.cy+24,F.R*1.2);b.addColorStop(0,'rgba(77,243,255,.2)');b.addColorStop(1,'rgba(77,243,255,0)');g.fillStyle=b;g.fillRect(0,0,W,H);
 path(ring(70),1);g.fillStyle='rgba(20,130,150,.17)';g.fill();
 g.lineWidth=1;g.strokeStyle='rgba(77,243,255,.13)';for(let r=10;r<70;r+=10){path(ring(r),1);g.stroke()}
 g.setLineDash([6,6]);g.strokeStyle='rgba(157,255,106,.55)';path(ring(27),1);g.stroke();g.setLineDash([]);
 glow('#4df3ff',14);g.lineWidth=2.5;path(ring(70),1);g.stroke();noglow();
 g.fillStyle='#4df3ff';for(let i=0;i<48;i++){const a=i/48*6.2832+now/4000,q=T(76*Math.cos(a),76*Math.sin(a));g.fillRect(q[0]-1,q[1]-1,2,2)}
 path([T(-1.7,-11),T(1.7,-11),T(1.7,11),T(-1.7,11)],1);g.fillStyle='rgba(255,210,120,.4)';g.fill();g.strokeStyle='#ffd27a';g.lineWidth=1.5;g.stroke();
 for(const y of[-11,11]){const q=T(0,y);g.fillStyle='#fff';g.fillRect(q[0]-2,q[1]-10,4,10)}
 const q=T(BAT[0]-.8,BAT[1]);glow('#4df3ff',10);g.fillRect(q[0]-3,q[1]-26,6,22);g.beginPath();g.arc(q[0],q[1]-30,5,0,7);g.fill();noglow();
 lab('Bowler end',T(0,11)[0],T(0,11)[1]-18,'#8fdde8',15)}

const P=(n,tag,a,d,text,facts)=>({n,tag,a,d,text,facts,k:'p'});
const Z=(n,z,text,facts)=>({n,tag:'Ground area',z,text,facts,k:'z'});
const ITEMS=[
Z('Off side','off','For a right-handed batter, the half of the field on the side the bat faces: to his right when he looks down the pitch.',['Cover, point, slip, gully and third man live here','Reverse for left-handed batters','The off stump is on this side of the batter']),
Z('Leg side','leg','The half of the field behind the batter\'s body: his left when he looks down the pitch for a right-hander.',['Mid-on, mid-wicket, square leg and fine leg live here','A maximum of five fielders may stand here in most limited-overs formats','The leg stump is on this side']),
Z('Pitch','pitch','The 22-yard strip at the middle of the ground where bowling and batting happen.',['22 yards (20.12 m) between the two sets of stumps','10 feet (3.05 m) wide','Its condition shapes how the ball bounces and spins']),
Z('30-yard circle','circle','The dashed ring that marks the inner field, measured from the middle of the pitch.',['In limited-overs cricket, a minimum number of fielders must stay inside it','Fielding restrictions change in the powerplay and death overs','Shots inside it can be fielded quickly, shots outside it run to the boundary']),
Z('Boundary rope','rope','The edge of the playing area. A ball reaching it along the ground is four runs, in the air it is six.',['Ropes are usually 65 to 85 m from the centre in international grounds','A fielder touching the rope while holding the ball gives the batting side runs','Grounds vary, so the size shapes the tactics']),
Z('Sightscreen','screen','A big white or black screen behind the bowler\'s arm, so the batter can see the ball clearly.',['Placed just inside the boundary, on both ends','White for red balls, black for white balls in many grounds','Not used on the same side the batter faces in side-on shots']),
P('Wicketkeeper','Close',180,10,'Stands behind the stumps, collects the ball, and takes catches, stumpings and run-outs.',['Wears gloves and pads','Stands up to the stumps for spinners, back for fast bowlers','The only fielder allowed to wear gloves']),
P('First slip','Close',162,13,'Stands next to the keeper to catch edges off the outside edge.',['Has the best chance of catching edges from fast bowlers','Fielders at second and third slip stand beside him','Reflexes matter most']),
P('Gully','Close',125,16,'Stands between the slips and point, waiting for edged shots that carry square.',['Faster, lower catches than slip','Needs great hands','Often set for aggressive pace attacks']),
P('Silly point','Close',85,6,'Very close on the off side, a brave position that catches balls hit off the bat and pad.',['Fields in helmet and shin pads','Used mainly against spinners','Aggressive, attacking fielding']),
P('Point','Inner ring',90,20,'Square on the off side, saves cut shots and quick runs.',['Needs fast hands and a strong arm','Can run out a batter backing up','A key saving position']),
P('Cover','Inner ring',45,28,'Between point and mid-off, stops drives through the off side.',['Often one of the best fielders','Quick pickup and accurate throw','Many cover drives end here']),
P('Extra cover','Inner ring',30,36,'A little wider than cover and deeper towards mid-off, tackling firm drives.',['Saves boundaries from the cover drive','Needs to cover the gap quickly','Used when the batter loves the drive']),
P('Mid-off','Inner ring',12,38,'Close to the bowler on the off side, stops straight drives and looks for run outs.',['Often the captain\'s spot in club cricket','Watches for the batter running','Good for catching mistimed lofted drives']),
P('Mid-on','Inner ring',-12,38,'Mirror of mid-off on the leg side, stops on drives and pushes.',['Strong throw to the keeper or bowler','Saves quick singles','Positioned for the batter\'s on drive']),
P('Mid-wicket','Inner ring',-50,34,'Between mid-on and square leg, guards against pulls and flicks.',['Fielder needs quick reactions','Good place for pulled shots','Quick runs are often stopped here']),
P('Square leg','Inner ring',-90,26,'Square to the batter on the leg side, covering sweeps and flicks.',['Often where the umpire stands','Catches edges from sweeps','Positioned square to the stumps']),
P('Short leg','Close',-85,5,'Very close on the leg side, catching balls hit off pad and bat.',['Helmet and shin guards are essential','Used against spinners','Takes bat-pad catches']),
P('Fine leg','Outfield',-155,52,'Behind square on the leg side, stops glances and fine shots.',['Often placed deep, near the rope','Saves boundaries from the leg glance','Used for bouncer-style bowlers']),
P('Third man','Outfield',140,58,'Behind point on the off side, stops late cuts and edges.',['Deep, near the boundary','Saves edged boundaries','Used with a new ball']),
P('Long-off','Boundary',8,76,'Straight behind the bowler on the off side, near the rope.',['Stops lofted drives','Catches six attempts at the rope','Good for big hitters']),
P('Long-on','Boundary',-8,76,'Straight behind the bowler on the leg side, near the rope.',['Catches lofted straight hits','Often used in slog overs','Needs a strong throw']),
P('Deep mid-wicket','Boundary',-52,62,'Deep on the leg side, near the rope between long-on and square leg.',['The prime region for pull and slog shots','Fielder watches for sixes','Strong arm to throw from the rope'])];
const field_=field;
function draw(it,p,now){
 base(now);
 const on=(c,w)=>{glow(c,16);g.lineWidth=w||3},A=.55+.3*Math.sin(now/200);
 field_(now);
 if(it.z==='off'||it.z==='leg'){const s=it.z==='off'?1:-1,pts=[];for(let i=0;i<=36;i++){const a=-Math.PI/2+i/36*Math.PI;pts.push(T(s*70*Math.cos(a),70*Math.sin(a)))}path(pts,1);g.fillStyle=it.z==='off'?'rgba(157,255,106,'+A*.35+')':'rgba(255,95,210,'+A*.35+')';g.fill();lab(it.z==='off'?'OFF SIDE':'LEG SIDE',T(s*38,0)[0],T(s*38,0)[1],'#fff',22)}
 if(it.z==='pitch'){path([T(-1.7,-11),T(1.7,-11),T(1.7,11),T(-1.7,11)],1);on('#ffd27a');g.stroke();noglow();lab('22 yards',T(0,0)[0]+40,T(0,0)[1],'#ffd27a',20)}
 if(it.z==='circle'){g.setLineDash([]);path(ring(27),1);on('#9dff6a',4);g.stroke();noglow();lab('30-yard circle',T(0,27)[0],T(0,27)[1]-10,'#9dff6a',18)}
 if(it.z==='rope'){path(ring(70),1);on('#ff5fd2',5);g.stroke();noglow();lab('Boundary rope',T(0,-70)[0],T(0,-70)[1]+22,'#ff5fd2',20)}
 if(it.z==='screen'){path([T(-8,66),T(8,66),T(8,69),T(-8,69)],1);on('#fff');g.fill();noglow();lab('Sightscreen',T(0,69)[0],T(0,69)[1]-12,'#fff',18)}
 for(const f of ITEMS)if(f.k==='p'){const q=T(...at(f.a,f.d));g.fillStyle=f===it?'#fff':'rgba(77,243,255,.55)';g.beginPath();g.arc(q[0],q[1],f===it?5:3.5,0,7);g.fill()}
 if(it.k==='p'){const b=T(...BAT),q=T(...at(it.a,it.d)),k=clamp(p*3,0,1);glow('#ffd27a',8);g.setLineDash([6,5]);g.lineWidth=2;g.beginPath();g.moveTo(b[0],b[1]);g.lineTo(lerp(b[0],q[0],k),lerp(b[1],q[1],k));g.stroke();g.setLineDash([]);noglow();
  for(let i=0;i<3;i++){glow('#9dff6a',14);g.lineWidth=2;g.globalAlpha=1-((now/900+i/3)%1);const r=6+((now/900+i/3)%1)*30;g.beginPath();g.ellipse(q[0],q[1],r,r*.6,0,0,7);g.stroke()}g.globalAlpha=1;noglow();
  lab(it.n,q[0],q[1]-18,'#fff',22);lab('about '+it.d+' yards from the bat',300,500,'#8fdde8',16)}
 lab('Batter',T(...BAT)[0],T(...BAT)[1]+22,'#8fdde8',14)}

function info(){const it=ITEMS[cur];$('#info').innerHTML='<span class="tag">'+it.tag+'</span><h2>'+it.n+'</h2><p>'+it.text+'</p><ul>'+it.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul>';[...$('#list').children].forEach((b,i)=>b.setAttribute('aria-pressed',i==cur))}
function sel(i){cur=(i+ITEMS.length)%ITEMS.length;pt=0;info()}
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it.n;b.onclick=()=>sel(i);$('#list').appendChild(b)});
$('#rp').onclick=()=>pt=0;$('#sl').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',slow)};$('#pa').onclick=e=>{paused=!paused;e.target.setAttribute('aria-pressed',paused)};
if(typeof F!=='undefined'){const sp=$('#sp');sp.hidden=false;sp.onclick=()=>{spin=!spin;sp.setAttribute('aria-pressed',spin)};let dx=null;cv.addEventListener('pointerdown',e=>{dx=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(dx!==null){F.yaw+=(e.clientX-dx)*.01;dx=e.clientX}});cv.addEventListener('pointerup',()=>dx=null)}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')sel(cur+1);if(e.key==='ArrowLeft')sel(cur-1)});
function loop(now){const dt=now-last;last=now;if(!paused)pt+=dt*(slow?.35:1);if(spin)F.yaw+=dt*.0005;const it=ITEMS[cur],dur=it.dur||4600;draw(it,(pt%dur)/dur,now);requestAnimationFrame(loop)}
sel(0);requestAnimationFrame(loop);
</script></body></html>
